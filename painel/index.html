<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f1f1f">
  <title>Painel • DualShot Fotografia</title>
  <meta name="description" content="Painel administrativo DualShot.">
  <meta property="og:title" content="Painel • DualShot Fotografia">
  <meta property="og:description" content="Painel administrativo DualShot.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23292929'/%3E%3Ctext x='50' y='66' font-size='52' text-anchor='middle' fill='%23D71D26' font-family='Arial' font-weight='bold'%3ED%3C/text%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #1f1f1f; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #1f1f1f; }
    #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
      color: #E4E2DD; font: 600 13px/1.4 Arial, sans-serif; letter-spacing: 3px; transition: opacity .35s ease; }
    #carregando .logo { font-size: 22px; letter-spacing: 4px; } #carregando .logo b { color: #D71D26; }
    #carregando .barra { width: 120px; height: 3px; border-radius: 3px; background: #333; overflow: hidden; }
    #carregando .barra i { display: block; width: 40%; height: 100%; background: #D71D26; animation: vai 1.1s ease-in-out infinite; }
    @keyframes vai { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    #erro { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #E4E2DD; font: 14px/1.5 Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="carregando"><div class="logo"><b>DUAL</b>SHOT</div><div class="barra"><i></i></div></div>
  <div id="erro">Não foi possível carregar agora. Atualize a página ou fale com a DualShot pelo WhatsApp.</div>
  <script src="/config.js"></script>
  <script>
    (function () {
      var exec = window.DUALSHOT_EXEC || '';
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(exec)) { document.getElementById('carregando').style.display = 'none'; document.getElementById('erro').style.display = 'flex'; return; }
      var params = new URLSearchParams(location.search);
      // Painel administrativo
      var destino = exec + '?admin=true';
      var f = document.createElement('iframe');
      f.src = destino; f.title = document.title;
      f.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
      f.addEventListener('load', function () { var c = document.getElementById('carregando'); c.style.opacity = '0'; setTimeout(function () { c.style.display = 'none'; }, 400); });
      document.body.appendChild(f);
      setTimeout(function () { var c = document.getElementById('carregando'); if (c.style.display !== 'none') c.style.opacity = '.6'; }, 12000);
    })();
  </script>
</body>
</html>
