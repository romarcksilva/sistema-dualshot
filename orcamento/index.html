<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#292929">
  <title>Solicite seu orçamento • DualShot Fotografia</title>
  <meta name="description" content="Casamentos, ensaios e eventos. Peça seu orçamento em poucos minutos.">
  <meta property="og:title" content="Solicite seu orçamento • DualShot Fotografia">
  <meta property="og:description" content="Casamentos, ensaios e eventos. Peça seu orçamento em poucos minutos.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:image" content="https://portal.dualshot.com.br/og.jpg">
  <meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body { margin: 0; height: 100%; background: #292929; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #292929; z-index: 1; }
    #carregando { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; gap: 26px; align-items: center; justify-content: center;
      background: radial-gradient(120% 80% at 50% 42%, #333230 0%, #262625 45%, #1b1b1b 100%); transition: opacity .6s ease, transform .6s ease; }
    #carregando.saindo { opacity: 0; transform: scale(1.02); }
    #carregando .ds-visor, #carregando .ds-exif, #carregando .leg { opacity: 0; animation: dsSurge .9s ease .1s forwards; }
    #carregando .leg { font: 500 10px/1 Arial, sans-serif; letter-spacing: .45em; text-indent: .45em; text-transform: uppercase; color: #D9B97E; animation: dsSurge .8s ease .5s forwards, dsLegenda 2.8s ease-in-out 1.4s infinite; }
    @keyframes dsSurge { to { opacity: 1; } }
    @keyframes dsLegenda { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    /* Visor de câmera focando: a logo entra em foco, os cantos de AF se fecham e confirmam, linha de exposição embaixo */
    .ds-visor{position:relative;padding:26px 34px;display:inline-flex;align-items:center;justify-content:center}
    .ds-visor img{display:block;width:min(220px,56vw);height:auto;animation:dsFoco 3.6s cubic-bezier(.45,0,.2,1) infinite}
    .ds-visor>i{position:absolute;width:18px;height:18px;border:0 solid #E9D3A4;opacity:.55;animation:dsCanto 3.6s cubic-bezier(.45,0,.2,1) infinite}
    .ds-visor>i.v1{top:0;left:0;border-top-width:1.5px;border-left-width:1.5px;--dx:-14px;--dy:-10px}
    .ds-visor>i.v2{top:0;right:0;border-top-width:1.5px;border-right-width:1.5px;--dx:14px;--dy:-10px}
    .ds-visor>i.v3{bottom:0;left:0;border-bottom-width:1.5px;border-left-width:1.5px;--dx:-14px;--dy:10px}
    .ds-visor>i.v4{bottom:0;right:0;border-bottom-width:1.5px;border-right-width:1.5px;--dx:14px;--dy:10px}
    .ds-visor>b{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 0 1px rgba(233,211,164,.6);animation:dsPonto 3.6s ease infinite}
    @keyframes dsFoco{0%{filter:blur(7px) brightness(.8);opacity:.75;transform:scale(1.035)}
     34%{filter:blur(1.2px) brightness(.95);opacity:1;transform:scale(1.005)}
     40%{filter:blur(2.2px);transform:scale(1.01)}
     48%{filter:blur(0) brightness(1);opacity:1;transform:none}
     51%{filter:blur(0) brightness(1.35) drop-shadow(0 0 12px rgba(255,248,232,.4));opacity:1;transform:none}
     60%,82%{filter:blur(0) brightness(1);opacity:1;transform:none}
     100%{filter:blur(7px) brightness(.8);opacity:.75;transform:scale(1.035)}}
    @keyframes dsCanto{0%{transform:translate(var(--dx),var(--dy));opacity:.35}
     40%{transform:translate(calc(var(--dx)*.15),calc(var(--dy)*.15));opacity:.6}
     48%{transform:none;opacity:1;border-color:#fff;filter:drop-shadow(0 0 6px rgba(255,240,210,.9))}
     56%,82%{transform:none;opacity:.9;border-color:#E9D3A4;filter:none}
     100%{transform:translate(var(--dx),var(--dy));opacity:.35}}
    @keyframes dsPonto{0%,44%{opacity:0;transform:scale(.4)}48%{opacity:1;transform:scale(1.6)}56%,82%{opacity:.0;transform:scale(1)}100%{opacity:0}}
    .ds-exif{display:flex;gap:18px;align-items:center;font:500 10.5px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.12em;color:#9d988f}
    .ds-exif span{white-space:nowrap}
    .ds-exif .af{display:inline-flex;align-items:center;gap:6px;color:#6f6a62;animation:dsAf 3.6s ease infinite}
    .ds-exif .af:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
    @keyframes dsAf{0%,44%{color:#6f6a62}48%,82%{color:#E9D3A4;text-shadow:0 0 8px rgba(233,211,164,.6)}100%{color:#6f6a62}}
    .ds-exif .med{position:relative;width:64px;height:9px;border-bottom:1px solid #5a564f}
    .ds-exif .med:before{content:"";position:absolute;left:50%;bottom:0;width:1px;height:9px;background:#8a857c}
    .ds-exif .med i{position:absolute;bottom:-1px;left:50%;width:2px;height:6px;margin-left:-1px;background:#E9D3A4;animation:dsMed 3.6s cubic-bezier(.45,0,.2,1) infinite}
    @keyframes dsMed{0%{transform:translateX(-26px)}30%{transform:translateX(12px)}42%{transform:translateX(-5px)}48%,82%{transform:none}100%{transform:translateX(-26px)}}
    @media (prefers-reduced-motion:reduce){.ds-visor *,.ds-exif *{animation:none!important}}
    /* disparo: clarão do flash logo depois do foco travar */
    .ds-flash-tela{position:absolute;inset:0;pointer-events:none;opacity:0;z-index:2;
      background:radial-gradient(70% 60% at 50% 46%,rgba(255,250,238,.24),rgba(255,248,232,.07) 55%,rgba(255,248,232,.02) 100%);animation:dsFlash 3.6s linear infinite}
    @keyframes dsFlash{0%,49%{opacity:0}50.5%{opacity:1}53%{opacity:.35}62%,100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.ds-flash-tela{animation:none!important}}
    #erro { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #E4E2DD; font: 14px/1.5 Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="carregando"><span class="ds-flash-tela"></span><div class="ds-visor"><i class="v1"></i><i class="v2"></i><i class="v3"></i><i class="v4"></i><b></b><img src="/logo.png" alt="DualShot Fotografia"></div><div class="ds-exif"><span>ƒ/1.8</span><span>1/250</span><span class="med"><i></i></span><span>ISO 100</span><span class="af">AF</span></div><div class="leg" id="carregando-leg">Preparando seu orçamento</div></div>
  <div id="erro">Não foi possível carregar agora. Atualize a página ou fale com a DualShot pelo WhatsApp.</div>
  <script src="/config.js"></script>
  <script>
    (function () {
      var exec = window.DUALSHOT_EXEC || '';
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(exec)) { document.getElementById('carregando').style.display = 'none'; document.getElementById('erro').style.display = 'flex'; return; }
      var params = new URLSearchParams(location.search);
      // Formulário de orçamento (mantém ?ref= das indicações)
      params.set('orcamento', '1');
      var destino = exec + '?' + params.toString();
      var f = document.createElement('iframe'), mostrado = false;
      f.src = destino; f.title = document.title; f.style.visibility = 'hidden';   // fica escondido até o sistema avisar que está pronto
      f.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
      function mostrar() {
        if (mostrado) return; mostrado = true;
        f.style.visibility = 'visible';   // o sistema aparece por baixo da logo…
        setTimeout(function () {          // …e a logo sai devagar por cima, sem tela vazia no meio
          var c = document.getElementById('carregando'); c.classList.add('saindo'); setTimeout(function () { c.style.display = 'none'; }, 650);
        }, 150);
      }
      window.addEventListener('message', function (ev) {
        if (ev.data === 'ds-pronto' && /(^|\.)(script\.google\.com|googleusercontent\.com)$/.test(new URL(ev.origin).hostname)) mostrar();
      });
      f.addEventListener('load', function () { setTimeout(mostrar, 25000); });   // garantia: nunca fica preso (o sistema avisa quando a tela está pronta com os dados)
      document.body.appendChild(f);
    })();
  </script>
</body>
</html>
