<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#292929">
  <title>Solicite seu orçamento • DualShot Fotografia</title>
  <meta name="description" content="Casamentos, ensaios e eventos. Peça seu orçamento em poucos minutos.">
  <meta property="og:title" content="Solicite seu orçamento • DualShot Fotografia">
  <meta property="og:description" content="Casamentos, ensaios e eventos. Peça seu orçamento em poucos minutos.">
  <meta property="og:type" content="website">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta property="og:image" content="https://portal.dualshot.com.br/og.jpg">
  <meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <style>
    html, body { margin: 0; height: 100%; background: #292929; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: #292929; }
    #carregando { position: fixed; inset: 0; display: flex; flex-direction: column; gap: 14px; align-items: center; justify-content: center;
      color: #E4E2DD; font: 600 13px/1.4 Arial, sans-serif; letter-spacing: 3px; transition: opacity .35s ease; }
    #carregando .logo-img { width: min(260px, 62vw); height: auto; animation: surge .6s ease both; }
    @keyframes surge { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    #carregando .barra { width: 120px; height: 3px; border-radius: 3px; background: #333; overflow: hidden; }
    #carregando .barra i { display: block; width: 40%; height: 100%; background: #D71D26; animation: vai 1.1s ease-in-out infinite; }
    @keyframes vai { 0% { transform: translateX(-100%); } 100% { transform: translateX(260%); } }
    #erro { display: none; position: fixed; inset: 0; align-items: center; justify-content: center; text-align: center; padding: 24px; color: #E4E2DD; font: 14px/1.5 Arial, sans-serif; }
  </style>
</head>
<body>
  <div id="carregando"><img src="/logo.png" alt="DualShot Fotografia" class="logo-img"><div class="barra"><i></i></div></div>
  <div id="erro">Não foi possível carregar agora. Atualize a página ou fale com a DualShot pelo WhatsApp.</div>
  <script src="/config.js"></script>
  <script>
    (function () {
      var exec = window.DUALSHOT_EXEC || '';
      if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(exec)) { document.getElementById('carregando').style.display = 'none'; document.getElementById('erro').style.display = 'flex'; return; }
      var params = new URLSearchParams(location.search);
      // Formulário de orçamento (mantém ?ref= das indicações)
      params.set('orcamento', '1');
      var destino = exec + '?' + params.toString();
      var f = document.createElement('iframe');
      f.src = destino; f.title = document.title;
      f.setAttribute('allow', 'clipboard-read; clipboard-write; fullscreen');
      f.addEventListener('load', function () { var c = document.getElementById('carregando'); c.style.opacity = '0'; setTimeout(function () { c.style.display = 'none'; }, 400); });
      document.body.appendChild(f);
      setTimeout(function () { var c = document.getElementById('carregando'); if (c.style.display !== 'none') c.style.opacity = '.6'; }, 12000);
    })();
  </script>
</body>
</html>
